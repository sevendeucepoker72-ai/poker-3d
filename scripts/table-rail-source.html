<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;}svg{display:block;}</style></head>
<body>
<svg width="1600" height="681" viewBox="0 0 1175 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2334"/><stop offset="34%" stop-color="#0e121c"/>
      <stop offset="70%" stop-color="#070910"/><stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0c0"/><stop offset="48%" stop-color="#e7bf5c"/><stop offset="100%" stop-color="#8a6a24"/>
    </linearGradient>
    <filter id="tube" x="-6%" y="-14%" width="112%" height="128%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="hf"/>
      <feDiffuseLighting in="hf" surfaceScale="6" diffuseConstant="0.62" lighting-color="#2c3c60" result="d">
        <feDistantLight azimuth="268" elevation="40"/></feDiffuseLighting>
      <feComposite in="d" in2="SourceAlpha" operator="in" result="dc"/>
      <feSpecularLighting in="hf" surfaceScale="9" specularConstant="0.82" specularExponent="55" lighting-color="#c8ddff" result="s">
        <feDistantLight azimuth="268" elevation="66"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="sc"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dc"/><feMergeNode in="sc"/></feMerge>
    </filter>
    <path id="ring" fill-rule="evenodd"
      d="M2,250 a585.5,248 0 1,0 1171,0 a585.5,248 0 1,0 -1171,0 Z
         M40,250 a547.5,210 0 1,0 1095,0 a547.5,210 0 1,0 -1095,0 Z"/>
  </defs>
  <g filter="url(#tube)"><use href="#ring" fill="url(#carbon)"/></g>
  <ellipse cx="587.5" cy="250" rx="547.5" ry="210" fill="none" stroke="#05080f" stroke-width="6.5"/>
  <ellipse cx="587.5" cy="250" rx="547.5" ry="210" fill="none" stroke="url(#gold)" stroke-width="2.8"/>
  <ellipse cx="587.5" cy="250" rx="544.5" ry="207" fill="none" stroke="rgba(170,195,235,0.5)" stroke-width="1.2"/>
</svg>
</body></html>
